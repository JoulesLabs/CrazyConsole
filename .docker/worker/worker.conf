[supervisord]
logfile=/var/log/supervisord.log         ; main log file, adjust if needed
pidfile=/var/run/supervisord.pid         ; PID file location
nodaemon=true                            ; keep in foreground, good for Docker

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock    ; use a unix socket for `supervisorctl`

[program:hyperf]
command=php /opt/www/bin/hyperf.php start
user=root
autostart=true
autorestart=true
startsecs=5
startretries=3
stderr_logfile=/tmp/hyperf-stderr.log    ; log locations adjusted to /tmp
stdout_logfile=/tmp/hyperf-stdout.log
