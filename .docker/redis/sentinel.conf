port 26379
dir /tmp

# Monitor the Redis master instance
sentinel monitor mymaster redis 6379 2

# Down-after-milliseconds: Time in milliseconds before a master is considered down
sentinel down-after-milliseconds mymaster 5000

# Failover timeout: Time in milliseconds before a failover is triggered
sentinel failover-timeout mymaster 10000

# Parallel-syncs: Number of replicas to reconfigure at the same time during a failover
sentinel parallel-syncs mymaster 1

# Authentication password (if Redis requires a password)
# sentinel auth-pass mymaster your_secure_password

# Logging
loglevel notice
logfile /var/log/redis/sentinel.log